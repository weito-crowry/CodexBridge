[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codexbridge"
version = "0.1.0"
description = "A thin Streamable HTTP MCP bridge to the local Codex App Server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
console = [
    "PySide6>=6.8,<7",
]
package = [
    "pyinstaller>=6.22,<7",
]

[project.scripts]
codex-bridge = "codex_bridge.__main__:main"
codex-bridge-console = "codex_bridge.console_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_bridge"]
include = ["src/codex_bridge/assets/*.html", "src/codex_bridge/assets/*.ico"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/ui/setup/node_modules/",
    "/ui/setup/dist/",
    "/dist/",
    "/build/",
    "/.venv/",
    "/.tools/",
    "/integration-artifacts/",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
