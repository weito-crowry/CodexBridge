    <main id="app" aria-labelledby="title">
      <h1 id="title">CodexBridge Setup</h1>
      <p id="status" role="status" aria-live="polite">Loading targets…</p>
      <form id="setup-form">
        <label for="target">Execution target</label>
        <select id="target" name="target" required disabled>
          <option value="">Choose a target</option>
        </select>

        <label for="model">Model</label>
        <select id="model" name="model" required disabled>
          <option value="">Choose a model</option>
        </select>
        <p id="model-description" class="hint"></p>

        <label for="reasoning">Reasoning effort</label>
        <select id="reasoning" name="reasoning" required disabled>
          <option value="">Choose an effort</option>
        </select>
        <p id="reasoning-description" class="hint"></p>

        <label for="access">Access</label>
        <select id="access" name="access" disabled>
          <option value="inherit">Default — Use Codex settings</option>
          <option value="danger-full-access">Full access — No filesystem sandbox restrictions</option>
        </select>
        <p id="access-warning" class="warning" role="alert" hidden>
          Codex may read and modify files outside the selected working directory.
          Approval handling remains enabled according to the Codex approval policy.
        </p>

        <label for="reviewer">Reviewer</label>
        <select id="reviewer" name="reviewer" disabled>
          <option value="auto_review" selected>Auto-review (default)</option>
          <option value="user">Manual (user)</option>
        </select>

        <div class="actions">
          <button id="refresh" type="button" disabled>Refresh</button>
          <button id="confirm" type="submit" disabled>Confirm</button>
        </div>
      </form>
    </main>

  </body>
</html>
